name: Deploy OroBI Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/OroBI.Web/**'
      - 'src/OroBI.Gateway/**'
      - '.github/workflows/deploy-web.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_API_BASE_URL: ''
      VITE_COOKIE_PORTAL_ORIGIN: https://lively-sea-0776c9a0f.6.azurestaticapps.net
      VITE_COOKIE_API_BASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/OroBI.Web/package-lock.json
      - name: Install Web dependencies
        working-directory: src/OroBI.Web
        run: npm ci
      - name: Test Web
        working-directory: src/OroBI.Web
        run: npm test -- --run --maxWorkers=2
      - name: Test managed Free gateway
        working-directory: src/OroBI.Gateway
        run: npm test
      - name: Verify cookie API before publication
        shell: pwsh
        run: ./scripts/test-login-deployment.ps1 -WebOrigin https://lively-sea-0776c9a0f.6.azurestaticapps.net -ApiOrigin https://orobi-api.ashymoss-e2dce47a.eastus2.azurecontainerapps.io
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /src/OroBI.Web
          api_location: /src/OroBI.Gateway
          output_location: dist
          app_build_command: npm run build
      - name: Verify published same-origin gateway
        shell: pwsh
        run: ./scripts/test-login-deployment.ps1 -WebOrigin https://lively-sea-0776c9a0f.6.azurestaticapps.net
