name: Deploy Azure

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Azure resource group
        required: true
        type: string
      prefix:
        description: Lowercase resource prefix
        required: true
        type: string
      api_image:
        description: Published API image URI
        required: true
        type: string
      web_origin:
        description: HTTPS origin of the published web application
        required: true
        type: string
      enable_browser_session:
        description: Enable corporate HttpOnly cookies after DNS and HTTPS certificate binding are ready
        required: false
        type: boolean
        default: false
      use_free_gateway:
        description: Activate the existing orobi-web Free gateway without re-provisioning infrastructure
        type: boolean
        default: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - run: az bicep build --file infra/main.bicep
      - name: Deploy infrastructure with required runtime settings
        if: ${{ !inputs.use_free_gateway }}
        shell: pwsh
        env:
          DEPLOY_RESOURCE_GROUP: ${{ inputs.resource_group }}
          DEPLOY_PREFIX: ${{ inputs.prefix }}
          DEPLOY_API_IMAGE: ${{ inputs.api_image }}
          DEPLOY_WEB_ORIGIN: ${{ inputs.web_origin }}
          DEPLOY_BROWSER_SESSION: ${{ inputs.enable_browser_session }}
        run: >-
          ./scripts/deploy-azure.ps1 -Apply -Confirm:$false
          -ResourceGroup $env:DEPLOY_RESOURCE_GROUP
          -Prefix $env:DEPLOY_PREFIX
          -ApiImage $env:DEPLOY_API_IMAGE
          -WebOrigin $env:DEPLOY_WEB_ORIGIN
          -EnableBrowserSession:($env:DEPLOY_BROWSER_SESSION -eq 'true')
          -ConfigureRuntimeSecrets
      - name: Activate existing Free gateway runtime
        if: ${{ inputs.use_free_gateway }}
        shell: pwsh
        env:
          DEPLOY_RESOURCE_GROUP: ${{ inputs.resource_group }}
          DEPLOY_API_IMAGE: ${{ inputs.api_image }}
        run: ./scripts/deploy-free-gateway.ps1 -Apply -Confirm:$false -ResourceGroup $env:DEPLOY_RESOURCE_GROUP -ApiImage $env:DEPLOY_API_IMAGE
